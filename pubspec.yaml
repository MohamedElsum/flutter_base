name: flutter_base
description: "A production-ready Flutter base project template."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation
  go_router: ^17.1.0

  # Networking
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.4

  # Local Storage
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4

  # Dependency Injection
  get_it: ^9.2.1

  # Error Handling
  dartz: ^0.10.1

  # Responsive
  responsive_framework: ^1.5.1

  # Environment
  flutter_dotenv: ^5.2.1

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Utils
  logger: ^2.5.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  hive_ce_generator: ^1.8.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env.dev
    - .env.staging
    - .env.prod
